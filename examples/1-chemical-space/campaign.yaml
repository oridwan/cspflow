# ===========================================================================
#  EXAMPLE 1 of 3 -- source mode: chemical_space
#
#  "Search a region of the periodic table."  You name element groups and how
#  many elements to take from each; cspflow assembles every chemical system
#  the rules allow, enumerates the formulas inside each one, and generates
#  structures for all of them.
#
#  This is the mode with a size multiplier hiding in it. The sweep below is
#  36 ternary systems / 3,384 compositions / ~165,000 structures -- check it
#  with `csp source --dry-run` BEFORE you run anything.
#
#  Copy this folder, or:  csp init my-sweep -m orion
# ===========================================================================

name: example-sweep
machine: orion                  # shipped: orion | generic_slurm | local.
                                # `csp init` copies the profile in as
                                # machine.yaml so you can edit it; a path to
                                # any YAML file works here too.
workdir: /scratch/$USER/cspflow/example-sweep    # database, job dirs, VASP output
archive: /projects/mmi/Ridwan/cspflow_archive/example-sweep   # null to keep nothing

# ---------------------------------------------------------------------------
# SOURCE
# ---------------------------------------------------------------------------
source:
  - mode: chemical_space
    name: sweep                 # required once a campaign has >1 source; it is
                                # how a candidate's origin stays answerable
    chemical_space:

      # Each group is a pool plus how many elements to take from it. Group
      # names (A/B/C) are labels only -- call them RE/TM/X if you prefer.
      groups:

        # Rare earths. pick: 1 -> one RE per system.
        A:
          elements: [Sm, Tb]
          pick: 1               # int, or a list of arities: [1, 2] would also
                                # emit systems taking two from this group

        # The magnetic transition metals, held to at least 75% of the formula:
        # a magnet is mostly Fe. Without min_fraction the sweep spends most of
        # its budget on RE-rich compositions that cannot be what you want.
        B:
          elements: [Fe, Co, Ni]
          pick: 1
          min_fraction: 0.75    # of the atoms in the reduced formula
          # max_fraction: 0.95  # the other side of the same constraint

        # Stabilisers / substituents.
        C:
          elements: [Ti, V, Cr, Mn, Cu, Zn]
          pick: 1
          # min_fraction: 0.02  # force a non-trivial amount in
          # max_fraction: 0.15  # keep it a dopant rather than a component

      max_atoms_formula: 20     # cap on the REDUCED formula (Sm2Fe17 = 19).
                                # Raise it and the composition count climbs
                                # steeply; this is the sweep's main size dial.

      max_rare_earth: 1         # RE *species* in the assembled system, not the
                                # count within one group. Separate on purpose:
                                # {Sm,Tb} with pick: 2 would otherwise emit
                                # Sm-Tb-Fe unasked. null = no limit.

    # Applied to every composition the sweep produces; per-item overrides are
    # only available in composition_list (see example 2).
    defaults:
      z: {min: 1, max: 2}       # formula units of the REDUCED formula to build.
                                # Sm2Fe17 at z=2 is a 38-atom cell.
      max_atoms: 40             # hard cap on z * atoms-per-formula-unit. A row
                                # whose z would exceed this is dropped, not
                                # silently shrunk.
      n_structures:
        mode: per_atom          # per_atom | fixed
        structures_per_atom: 2.0    # 20-atom cell -> 40 structures
        # mode: fixed
        # count: 50             # same number for every row, regardless of size
      n_structures_scope: per_z  # per_z | total -- whether the count above is
                                # per Z value or split across the Z range

# ---------------------------------------------------------------------------
# GENERATE -- MatterGen, one job per composition batch
# ---------------------------------------------------------------------------
generate:
  engine: mattergen             # the only engine implemented
  mattergen:
    model: /projects/mmi/shuo/MatterGen_checkpoints/18-55-08
    mode: csp                   # csp: condition on composition (what you want
                                # here) | unconditional: ignore it
    max_batch_size: 100         # structures per forward pass; lower it if the
                                # GPU runs out of memory
    timeout_per_batch: 1800     # seconds before a batch is abandoned
  resources:
    role: gpu                   # maps to a partition in machine.yaml
    gpus: 1
    time: "24:00:00"

# ---------------------------------------------------------------------------
# SCREEN + DEDUP -- MLIP relaxation, then discard duplicates
# ---------------------------------------------------------------------------
screen:
  mlip: mattersim               # mattersim | mace | uma
  mattersim:
    model: MatterSim-v1.0.0-5M.pth
    fmax: 0.01                  # eV/A force convergence
    max_steps: 500              # a cell still moving at this point is kept and
                                # marked, not thrown away
    batch_size: 32
  dedup:
    matcher:                    # pymatgen StructureMatcher tolerances
      ltol: 0.2                 # fractional length
      stol: 0.2                 # site displacement
      angle_tol: 5.0            # degrees
  resources: {role: gpu, gpus: 1, time: "24:00:00"}

# ---------------------------------------------------------------------------
# REFERENCE -- the convex hull the candidates are measured against
# ---------------------------------------------------------------------------
reference:
  functionals: [GGA]
  thermo_type: GGA_GGA+U        # PINNED. Materials Project mixes functionals
                                # silently; a reference set containing more
                                # than one is refused rather than averaged.
  energy_scale: raw             # raw | mp_corrected (MP's anion corrections)
  mode: recompute               # mp_energies: take MP's numbers as they are
                                # recompute: run the reference phases through
                                #   OUR DFT so both sides of the hull share one
                                #   absolute scale.  See D101 -- until this is
                                #   wired, gate on the MLIP hull.
  prescreen_mode: mp_energies   # what Phase A's cheap hull uses
  prescreen_hull_max: 0.20      # eV/atom, deliberately wide for Phase A
  snapshot: true                # freeze the MP query so the hull cannot move
  snapshot_id: auto             # or a fixed id to reproduce an old run exactly
  relax_with_mlip: true         # relax reference phases with the same MLIP, so
                                # candidate and reference are treated alike
# cache: $CSPFLOW_CACHE/mp      # default ~/.cache/cspflow. Left commented
                                # because an undefined $VAR is a hard error
                                # (D007), so writing it here would break the
                                # campaign for anyone who has not exported it.

# ---------------------------------------------------------------------------
# CALIBRATE -- prove the cheap number predicts the expensive one
# ---------------------------------------------------------------------------
calibrate:
  mp:                           # free: compares against MP's own DFT at FIXED
                                # geometry. A sanity check, not the gate.
    on_fail: warn               # warn | block
    thresholds:
      mae_e_per_atom: 0.05      # eV/atom
      spearman_min: 0.90        # rank correlation -- the number that matters,
                                # since filtering is a ranking decision
      max_volume_drift: 0.05    # fractional
  pilot:                        # costs DFT: OUR DFT on a sample. The real gate.
    on_fail: block              # block: stop Phase B if the MLIP does not
                                # predict our own DFT well enough
    pilot_n: 40                 # structures to spend on the test
    thresholds: {mae_e_per_atom: 0.05, mae_e_hull: 0.05, spearman_min: 0.90}

# ---------------------------------------------------------------------------
# FILTER -- who is worth a VASP job
# ---------------------------------------------------------------------------
filter:
  e_above_hull_max: 0.10        # eV/atom. The single most consequential knob
                                # in the file: it sets Phase B's size.
  e_above_hull_max_source: calibrated   # calibrated: shift the cut by the
                                # measured MLIP-vs-DFT offset | literal: use
                                # the number above as written
  max_per_composition: 5        # keep the field broad; without it one prolific
                                # composition can fill the queue
  spacegroup:
    min_number: 1               # 1 = keep everything. 3 excludes P1 and P-1,
                                # which are usually unrelaxed noise.

# ---------------------------------------------------------------------------
# DFT -- the expensive half. Tags and k-points are in recipe.yaml.
# ---------------------------------------------------------------------------
dft:
  recipe: magnets               # shipped name, or a path: recipe.yaml
  potcar:
    tree: VASP6.4               # VASP6.4 | VASP5.2
    functional: PBE_64
    overrides: {}               # element -> POTCAR symbol, e.g. {Sm: Sm_3}
  rare_earth:
    f_treatment: frozen         # frozen: 4f in the core (Sm_3) -- tractable,
                                # and one convention per campaign
                                # valence: 4f in the valence, needs LDA+U
    magnetic_order: ferri       # ferri | ferro | antiferro
    reconstruct_ms: true        # add the frozen 4f moment back when reporting
  magnetism:
    mode: ferrimagnetic_retm    # RE moment antiparallel to the TM sublattice
    strict: true                # fail rather than let any site take a default
                                # MAGMOM -- a silent default is a wrong answer
  ldau:
    enabled: false              # true only with f_treatment: valence
    ldau_type: 2
    u: {}                       # element -> U in eV, e.g. {Sm: 6.0}
    j: {}
  nbands: auto                  # or an integer
  incar_overrides: {}           # applied on top of every recipe step, e.g.
                                # {NCORE: 8, LREAL: Auto}
  max_in_flight: 200            # jobs queued at once
  max_concurrent_tasks: 48
  select:
    rank_by: e_above_hull_mlip  # the order Phase B spends the budget in
    max_per_composition: 3
    max_total: 1500
    budget_core_hours: 200000   # Phase B stops here, mid-stream, cleanly

# ---------------------------------------------------------------------------
# ANALYZE
# ---------------------------------------------------------------------------
analyze:
  properties: [m_dft_raw, m_s_reconstructed, volume, spacegroup]
  report: html                  # html | none -- `csp report` writes report/
